<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trophy Cup</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>80 · Trophy Cup</b><br>A gold trophy cup with two handles on a marble base.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 80: "A gold trophy cup with two handles on a marble base."
const meta = { id: '80', name: 'Trophy Cup', prompt: 'A gold trophy cup with two handles on a marble base.', detail: 'medium' };

function build(THREE) {
  const root = new THREE.Group();
  const gold = new THREE.MeshStandardMaterial({ color: 0xf2c14e, metalness: 1, roughness: 0.18, side: THREE.DoubleSide });
  // Marble plinth: stepped boxes with veined vertex colors
  const marble = (w, h, y) => {
    const g = new THREE.BoxGeometry(w, h, w, 12, 4, 12);
    const p = g.attributes.position, cols = [];
    for (let i = 0; i < p.count; i++) {
      const v = Math.sin(p.getX(i) * 9 + p.getY(i) * 5 + Math.sin(p.getZ(i) * 7) * 2);
      const c = new THREE.Color(0xf3f1ec).lerp(new THREE.Color(0x8e9196), Math.pow(Math.max(0, v), 12)); cols.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.2, clearcoat: 0.8 }));
    m.position.y = y;
    root.add(m);
  };
  marble(1.1, 0.25, 0.125);
  marble(0.85, 0.3, 0.4);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.14), gold);
  plate.position.set(0, 0.4, 0.426);
  root.add(plate);
  // Cup: foot, stem with knop, bowl (lathe)
  const prof = [[0.001, 0.55], [0.3, 0.55], [0.28, 0.6], [0.1, 0.68], [0.07, 0.85], [0.12, 0.9], [0.07, 0.95], [0.08, 1.05]];
  for (let i = 0; i <= 16; i++) { const t = i / 16; prof.push([0.1 + 0.42 * Math.sin((t * Math.PI) / 2), 1.05 + t * 0.85]); }
  prof.push([0.55, 1.92], [0.5, 1.92]);
  root.add(new THREE.Mesh(new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), 48), gold));
  // Handles: S-curves on both sides
  for (const s of [-1, 1]) {
    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s * 0.5, 1.8, 0), new THREE.Vector3(s * 0.82, 1.78, 0), new THREE.Vector3(s * 0.85, 1.5, 0), new THREE.Vector3(s * 0.6, 1.3, 0), new THREE.Vector3(s * 0.3, 1.15, 0),
    ]);
    root.add(new THREE.Mesh(new THREE.TubeGeometry(c, 30, 0.035, 10), gold));
  }
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
