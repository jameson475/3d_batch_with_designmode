<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Viking Longship</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>67 · Viking Longship</b><br>A Viking longship with an overlapping clinker-built plank hull, a carved dragon-head prow and curled stern, a single mast with a red-and-white striped square sail, a row of painted round shields along each gunwale, and oars.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 67: "A Viking longship with an overlapping clinker-built plank hull, a carved dragon-head prow and curled stern, a single mast with a red-and-white striped square sail, a row of painted round shields along each gunwale, and oars."
const meta = { id: '67', name: 'Viking Longship', prompt: 'A Viking longship with an overlapping clinker-built plank hull, a carved dragon-head prow and curled stern, a single mast with a red-and-white striped square sail, a row of painted round shields along each gunwale, and oars.', detail: 'detailed' };

function build(THREE) {
  const root = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x7a5232, roughness: 0.85, side: THREE.DoubleSide });
  const dark = new THREE.MeshStandardMaterial({ color: 0x4d321e, roughness: 0.9 });
  const L = 4.2, B = 0.7, D = 0.55;
  // Hull section at u (0..1 along length): beam and sheer (gunwale rises toward the ends)
  const beam = (u) => B * Math.pow(Math.sin(Math.PI * u), 0.75) + 0.01;
  const sheer = (u) => 0.12 + 0.35 * Math.pow(2 * Math.abs(u - 0.5), 3);
  // Clinker strakes: each plank is a strip between two "heights" of the section, offset outward slightly
  const strakes = 6, segU = 40;
  for (let s = 0; s < strakes; s++) {
    const v0 = s / strakes, v1 = (s + 1.15) / strakes;   // 15% overlap
    const pos = [], idx = [];
    for (let i = 0; i <= segU; i++) {
      const u = i / segU, x = (u - 0.5) * L;
      for (const v of [v0, v1]) {
        const a = Math.PI * 0.5 * (1 - Math.min(v, 1));      // 0 = gunwale, PI/2 = keel
        const y = -Math.sin(a) * D + Math.min(v, 1) * sheer(u);
        const z = Math.cos(a) * beam(u) * (1 + 0.02 * s);
        pos.push(x, y, z);
      }
    }
    for (let i = 0; i < segU; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, s % 2 ? wood : wood);
    root.add(m);
    const mirror = m.clone(); mirror.scale.z = -1;
    root.add(mirror);
  }
  const keel = new THREE.Mesh(new THREE.BoxGeometry(L, 0.06, 0.06), dark);
  keel.position.y = -D;
  root.add(keel);
  // Stem & stern posts rising in curves; dragon head at the prow, spiral at the stern
  const post = (sgn) => {
    const pts = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push(new THREE.Vector3(sgn * (L / 2 - 0.05 + 0.4 * Math.sin(t * 1.3)), -D * (1 - t) + t * 1.3, 0)); }
    root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, 0.06, 8), dark));
    return pts[pts.length - 1];
  };
  const headPos = post(1);
  const head = new THREE.Group();
  head.position.copy(headPos);
  root.add(head);
  const skull = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.45, 8), dark);
  skull.rotation.z = -Math.PI / 2;
  skull.position.x = 0.18;
  head.add(skull);
  for (const z of [-0.06, 0.06]) {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.2, 6), dark);
    horn.position.set(-0.02, 0.12, z);
    horn.rotation.z = 0.6;
    head.add(horn);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), new THREE.MeshStandardMaterial({ color: 0xd4a22a, emissive: 0x6a4a00 }));
    eye.position.set(0.08, 0.05, z * 1.5);
    head.add(eye);
  }
  const tailPos = post(-1);
  const curl = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.04, 8, 24, Math.PI * 1.6), dark);
  curl.position.copy(tailPos).add(new THREE.Vector3(0.05, -0.1, 0));
  root.add(curl);

  // Mast + yard + striped square sail (vertex-colored plane, slightly billowed)
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 2.6, 10), dark);
  mast.position.y = 1.0;
  root.add(mast);
  const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.9, 8), dark);
  yard.rotation.x = Math.PI / 2;
  yard.position.y = 2.1;
  root.add(yard);
  const sg = new THREE.PlaneGeometry(1.8, 1.5, 12, 10);
  const sp = sg.attributes.position, cols = [];
  for (let i = 0; i < sp.count; i++) {
    const x = sp.getX(i), y = sp.getY(i);
    sp.setZ(i, 0.25 * Math.cos((x / 1.8) * Math.PI) * Math.cos((y / 1.5) * Math.PI * 0.5));
    const c = new THREE.Color(Math.floor((x + 0.9) / 0.3) % 2 ? 0xf2ece0 : 0xb3261e); cols.push(c.r, c.g, c.b);
  }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  sg.computeVertexNormals();
  const sail = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide }));
  sail.rotation.y = Math.PI / 2;
  sail.position.set(0.12, 1.33, 0);
  root.add(sail);

  // Shields along both gunwales + oars through the oar holes
  const shieldCols = [0xd6a531, 0x1f4e8c, 0xb3261e, 0x2f6b3a];
  const shieldGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.02, 20);
  for (let i = 0; i < 9; i++) {
    const u = 0.18 + (i / 8) * 0.64, x = (u - 0.5) * L;
    for (const s of [-1, 1]) {
      const sh = new THREE.Mesh(shieldGeo, new THREE.MeshStandardMaterial({ color: shieldCols[(i + (s > 0 ? 0 : 2)) % 4], roughness: 0.6 }));
      sh.rotation.x = Math.PI / 2;
      sh.position.set(x, sheer(u) - 0.02, s * (beam(u) + 0.03));
      root.add(sh);
      const boss = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 6), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 1, roughness: 0.3 }));
      boss.position.set(x, sheer(u) - 0.02, s * (beam(u) + 0.05));
      root.add(boss);
      if (i % 2 === 0) {
        const oar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.6, 6), wood);
        oar.rotation.x = s * 1.25;
        oar.position.set(x + 0.15, sheer(u) - 0.35, s * (beam(u) + 0.7));
        root.add(oar);
      }
    }
  }
  root.position.y = D + 0.1;
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
