<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Potted Succulent</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>04 · Potted Succulent</b><br>A small terracotta pot holding an echeveria succulent with rosette leaves arranged in a golden-angle spiral.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 04: "A small terracotta pot holding an echeveria succulent with rosette leaves arranged in a golden-angle spiral."
const meta = { id: '04', name: 'Potted Succulent', prompt: 'A small terracotta pot holding an echeveria succulent with rosette leaves arranged in a golden-angle spiral.' };

function build(THREE) {
  const root = new THREE.Group();
  const clay = new THREE.MeshStandardMaterial({ color: 0xc0643c, roughness: 0.9 });

  // Pot (tapered) + rim
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.55, 1.0, 40), clay);
  pot.position.y = 0.5;
  root.add(pot);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.8, 0.18, 40), clay);
  rim.position.y = 1.0;
  root.add(rim);
  const soil = new THREE.Mesh(new THREE.CircleGeometry(0.74, 32), new THREE.MeshStandardMaterial({ color: 0x4a3222, roughness: 1 }));
  soil.rotation.x = -Math.PI / 2;
  soil.position.y = 1.06;
  root.add(soil);

  // Rosette: leaves on a golden-angle spiral, inner leaves smaller and more upright
  const golden = Math.PI * (3 - Math.sqrt(5));
  const leafGeo = new THREE.SphereGeometry(1, 16, 12);
  const N = 34;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);            // 0 = center, 1 = outermost
    const size = 0.12 + 0.28 * t;
    const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.36 - 0.06 * t, 0.35, 0.55 - 0.12 * t), roughness: 0.55,
    }));
    leaf.scale.set(size * 0.45, size * 0.12, size);
    const pivot = new THREE.Group();
    pivot.rotation.y = i * golden;
    leaf.position.z = size * 0.8;
    leaf.rotation.x = -(1.1 - 0.9 * t);  // tilt: upright at center, flat at edge
    pivot.add(leaf);
    pivot.position.y = 1.1 + 0.15 * (1 - t);
    root.add(pivot);
  }

  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
