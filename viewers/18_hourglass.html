<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Antique Hourglass</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>18 · Antique Hourglass</b><br>An antique hourglass with a turned wooden frame, three spindle posts, a glass double bulb, and sand mid-flow.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 18: "An antique hourglass with a turned wooden frame, three spindle posts, a glass double bulb, and sand mid-flow."
const meta = { id: '18', name: 'Antique Hourglass', prompt: 'An antique hourglass with a turned wooden frame, three spindle posts, a glass double bulb, and sand mid-flow.' };

function build(THREE) {
  const root = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x5e3a20, roughness: 0.5 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, transmission: 0.9, thickness: 0.05, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
  const sandMat = new THREE.MeshStandardMaterial({ color: 0xe0b877, roughness: 1 });
  const H = 2.4, half = H / 2;

  // Glass: lathe of a double bulb (radius as function of height)
  const bulbR = (y) => 0.05 + 0.5 * Math.pow(Math.sin(Math.PI * Math.abs(y) / half), 0.9) * (Math.abs(y) < half ? 1 : 0);
  const prof = [];
  for (let i = 0; i <= 60; i++) {
    const y = -half + (i / 60) * H;
    prof.push(new THREE.Vector2(Math.max(bulbR(y), 0.04), y));
  }
  const g = new THREE.Mesh(new THREE.LatheGeometry(prof, 40), glass);
  g.position.y = half + 0.2;
  root.add(g);

  // Sand: bottom mound (lathe clipped to bulb), top remainder (inverted cone), falling stream
  const bottom = [];
  const fillH = 0.55;
  for (let i = 0; i <= 20; i++) {
    const y = -half + 0.02 + (i / 20) * fillH;
    const r = Math.max(bulbR(y) - 0.03, 0.01) * (1 - Math.pow(i / 20, 3) * 0.9);
    bottom.push(new THREE.Vector2(r, y));
  }
  bottom.unshift(new THREE.Vector2(0.001, -half + 0.02));
  bottom.push(new THREE.Vector2(0.001, -half + 0.02 + fillH + 0.04));
  const sb = new THREE.Mesh(new THREE.LatheGeometry(bottom, 32), sandMat);
  sb.position.y = half + 0.2;
  root.add(sb);
  const top = new THREE.Mesh(new THREE.ConeGeometry(0.33, 0.45, 32), sandMat);
  top.rotation.x = Math.PI;
  top.position.y = half + 0.2 + 0.35;
  root.add(top);
  const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, half - 0.1, 6), sandMat);
  stream.position.y = half + 0.2 - (half - 0.1) / 2 + 0.1;
  root.add(stream);

  // Turned end plates
  for (const y of [0.1, H + 0.3]) {
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 40), wood);
    plate.position.y = y;
    root.add(plate);
    const lip = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.05, 8, 40), wood);
    lip.rotation.x = Math.PI / 2;
    lip.position.y = y;
    root.add(lip);
  }

  // Three turned spindles (lathe with bead profile)
  const sp = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    sp.push(new THREE.Vector2(0.05 + 0.025 * Math.abs(Math.sin(t * Math.PI * 5)), t * H));
  }
  const spGeo = new THREE.LatheGeometry(sp, 12);
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI * 2 + Math.PI / 6;
    const s = new THREE.Mesh(spGeo, wood);
    s.position.set(Math.cos(a) * 0.66, 0.2, Math.sin(a) * 0.66);
    root.add(s);
  }
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
