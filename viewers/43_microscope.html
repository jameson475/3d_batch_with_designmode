<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Compound Microscope</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>43 · Compound Microscope</b><br>A laboratory compound microscope with a curved arm, an angled eyepiece tube, a rotating nosepiece with three objectives, a mechanical stage with slide clips, coarse and fine focus knobs, and a base lamp.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 43: "A laboratory compound microscope with a curved arm, an angled eyepiece tube, a rotating nosepiece with three objectives, a mechanical stage with slide clips, coarse and fine focus knobs, and a base lamp."
const meta = { id: '43', name: 'Compound Microscope', prompt: 'A laboratory compound microscope with a curved arm, an angled eyepiece tube, a rotating nosepiece with three objectives, a mechanical stage with slide clips, coarse and fine focus knobs, and a base lamp.' };

function build(THREE) {
  const root = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: 0xeceae4, roughness: 0.35 });
  const black = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, metalness: 0.4, roughness: 0.4 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xd2d5da, metalness: 1, roughness: 0.18 });

  // Base: rounded slab + lamp
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.14, 1.1), body);
  base.position.set(0, 0.07, 0.05);
  root.add(base);
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.08, 24), black);
  lamp.position.set(0, 0.18, 0.2);
  root.add(lamp);
  const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.07, 24), new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xfff0c0, emissiveIntensity: 1.5 }));
  bulb.rotation.x = -Math.PI / 2;
  bulb.position.set(0, 0.221, 0.2);
  root.add(bulb);

  // Curved arm: an extruded C-profile in the YZ plane
  const arm = new THREE.Shape();
  arm.moveTo(-0.18, 0); arm.lineTo(0.02, 0);
  arm.quadraticCurveTo(0.1, 0.7, -0.05, 1.35);
  arm.lineTo(-0.25, 1.3);
  arm.quadraticCurveTo(-0.12, 0.7, -0.18, 0);
  const armGeo = new THREE.ExtrudeGeometry(arm, { depth: 0.16, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02 });
  const armM = new THREE.Mesh(armGeo, body);
  armM.rotation.y = -Math.PI / 2;
  armM.position.set(0.08, 0.14, -0.3);
  root.add(armM);

  // Connectors: arm -> head, arm -> stage
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.42), body);
  neck.position.set(0, 1.38, -0.2);
  root.add(neck);
  const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.36), body);
  bracket.position.set(0, 0.56, -0.12);
  root.add(bracket);

  // Focus knobs (coarse + fine) on both sides
  for (const s of [-1, 1]) {
    const coarse = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.06, 24), black);
    coarse.rotation.z = Math.PI / 2;
    coarse.position.set(s * 0.14, 0.42, -0.3);
    root.add(coarse);
    const fine = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 20), chrome);
    fine.rotation.z = Math.PI / 2;
    fine.position.set(s * 0.19, 0.42, -0.3);
    root.add(fine);
  }

  // Stage with a slide and clips, condenser underneath
  const stage = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.5), black);
  stage.position.set(0, 0.6, 0.2);
  root.add(stage);
  const slide = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.008, 0.12), new THREE.MeshPhysicalMaterial({ color: 0xdfeff5, transmission: 0.8, roughness: 0.05, transparent: true, opacity: 0.7 }));
  slide.position.set(0, 0.625, 0.2);
  root.add(slide);
  for (const x of [-0.2, 0.2]) {
    const clip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.01, 0.2), chrome);
    clip.position.set(x, 0.632, 0.18);
    root.add(clip);
  }
  const condenser = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.12, 20), black);
  condenser.position.set(0, 0.52, 0.2);
  root.add(condenser);

  // Head: nosepiece + objectives
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.38), body);
  head.position.set(0, 1.35, 0.05);
  root.add(head);
  const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.08, 24), chrome);
  nose.position.set(0, 1.2, 0.2);
  nose.rotation.x = 0.2;
  root.add(nose);
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI * 2;
    const len = 0.12 + k * 0.05;
    const obj = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, len, 16), chrome);
    obj.position.set(Math.cos(a) * 0.08, 1.16 - len / 2, 0.2 + Math.sin(a) * 0.08);
    root.add(obj);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.015, 16), new THREE.MeshStandardMaterial({ color: [0xd33, 0xdd3, 0x36d][k] }));
    band.position.copy(obj.position).setY(1.16 - len * 0.3);
    root.add(band);
  }
  // Angled eyepiece tube
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.45, 20), black);
  tube.position.set(0, 1.58, -0.08);
  tube.rotation.x = -0.6;
  root.add(tube);
  const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.1, 20), black);
  eye.position.set(0, 1.78, -0.22);
  eye.rotation.x = -0.6;
  root.add(eye);
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
