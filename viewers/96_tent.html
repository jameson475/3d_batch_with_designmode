<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Camping Tent</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>96 · Camping Tent</b><br>A camping tent.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 96: "A camping tent."
const meta = { id: '96', name: 'Camping Tent', prompt: 'A camping tent.', detail: 'simple' };

function build(THREE) {
  const root = new THREE.Group();
  // A-frame tent: triangular prism with an open flap
  const tri = new THREE.Shape();
  tri.moveTo(-1, 0); tri.lineTo(1, 0); tri.lineTo(0, 1.3); tri.closePath();
  const door = new THREE.Path();
  door.moveTo(-0.35, 0); door.lineTo(0.35, 0); door.lineTo(0, 0.9); door.closePath();
  tri.holes.push(door);
  const tent = new THREE.Mesh(new THREE.ExtrudeGeometry(tri, { depth: 2.2, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: 0xe07a2f, roughness: 0.8, side: THREE.DoubleSide }));
  tent.position.z = -1.1;
  root.add(tent);
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.9), new THREE.MeshBasicMaterial({ color: 0x2a1a10 }));
  inside.position.set(0, 0.35, 0.9);
  root.add(inside);
  const flap = new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.9, 1.1), new THREE.Vector3(0.35, 0, 1.1), new THREE.Vector3(0.75, 0.1, 1.5)]), new THREE.MeshStandardMaterial({ color: 0xc9621f, side: THREE.DoubleSide }));
  flap.geometry.computeVertexNormals();
  root.add(flap);
  // Guy lines + pegs
  for (const z of [-1.1, 1.1]) {
    const top = new THREE.Vector3(0, 1.3, z), peg = new THREE.Vector3(0, 0, z + Math.sign(z) * 0.8);
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([top, peg]), new THREE.LineBasicMaterial({ color: 0xdddddd })));
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.01, 0.15, 6), new THREE.MeshStandardMaterial({ color: 0x888888 }));
    p.position.copy(peg).setY(0.05);
    root.add(p);
  }
  const ground = new THREE.Mesh(new THREE.CircleGeometry(2.4, 32), new THREE.MeshStandardMaterial({ color: 0x6f8f3f, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  root.add(ground);
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
