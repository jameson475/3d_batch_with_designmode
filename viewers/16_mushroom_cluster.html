<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mushroom Cluster</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>16 · Mushroom Cluster</b><br>A cluster of five fly-agaric mushrooms of different sizes growing from a mossy log, red caps with white spots.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 16: "A cluster of five fly-agaric mushrooms of different sizes growing from a mossy log, red caps with white spots."
const meta = { id: '16', name: 'Mushroom Cluster', prompt: 'A cluster of five fly-agaric mushrooms of different sizes growing from a mossy log, red caps with white spots.' };

function build(THREE) {
  const root = new THREE.Group();
  const bark = new THREE.MeshStandardMaterial({ color: 0x5b4330, roughness: 1 });
  const moss = new THREE.MeshStandardMaterial({ color: 0x5d7f36, roughness: 1, flatShading: true });
  const stem = new THREE.MeshStandardMaterial({ color: 0xf1eadb, roughness: 0.8 });
  const cap = new THREE.MeshStandardMaterial({ color: 0xc8261b, roughness: 0.35 });
  const spot = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
  const rng = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(11);

  // Log lying on its side
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 3.0, 20), bark);
  log.rotation.z = Math.PI / 2;
  log.position.y = 0.45;
  root.add(log);
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.18 + rng() * 0.12, 0), moss);
    m.position.set((rng() - 0.5) * 2.6, 0.82 + rng() * 0.06, (rng() - 0.5) * 0.4);
    m.scale.y = 0.4;
    root.add(m);
  }

  // Mushroom: lathe stem with a slight flare + dome cap + spots scattered on the dome
  function mushroom(s, x, z, lean) {
    const g = new THREE.Group();
    const h = 1.1 * s;
    const prof = [[0.16, 0], [0.12, h * 0.2], [0.1, h * 0.7], [0.13, h]].map(([r, y]) => new THREE.Vector2(r * s, y));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 16), stem));
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.17 * s, 0.06 * s, 16, 1, true), stem);
    ring.position.y = h * 0.72;
    g.add(ring);
    const R = 0.5 * s;
    const c = new THREE.Mesh(new THREE.SphereGeometry(R, 28, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), cap);
    c.scale.y = 0.75;
    c.position.y = h - 0.05 * s;
    g.add(c);
    for (let k = 0; k < 9; k++) {
      const th = rng() * Math.PI * 2, ph = 0.15 + rng() * 1.2;
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.045 * s, 8, 6), spot);
      d.position.set(Math.sin(ph) * Math.cos(th) * R, Math.cos(ph) * R * 0.75 + h - 0.05 * s, Math.sin(ph) * Math.sin(th) * R);
      d.scale.y = 0.5;
      g.add(d);
    }
    g.position.set(x, 0.8, z);
    g.rotation.z = lean;
    return g;
  }
  [[1.0, -0.2, 0.05, 0.1], [0.75, 0.55, -0.1, -0.2], [0.55, -0.9, 0.15, 0.3], [0.4, 1.05, 0.2, -0.35], [0.3, -0.4, 0.3, 0.2]]
    .forEach(([s, x, z, l]) => root.add(mushroom(s, x, z, l)));
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
