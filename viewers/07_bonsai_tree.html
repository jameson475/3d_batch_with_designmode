<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Recursive Bonsai</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>07 · Recursive Bonsai</b><br>A bonsai tree in a shallow rectangular tray, with a recursively branching trunk and clustered foliage pads.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 07: "A bonsai tree in a shallow rectangular tray, with a recursively branching trunk and clustered foliage pads."
const meta = { id: '07', name: 'Recursive Bonsai', prompt: 'A bonsai tree in a shallow rectangular tray, with a recursively branching trunk and clustered foliage pads.' };

function build(THREE) {
  const root = new THREE.Group();
  const bark = new THREE.MeshStandardMaterial({ color: 0x5a3e2b, roughness: 0.95 });
  const leaf = new THREE.MeshStandardMaterial({ color: 0x3f7a3a, roughness: 0.8, flatShading: true });
  const rng = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);

  // Tray
  const tray = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.3, 1.5), new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 }));
  tray.position.y = 0.15;
  root.add(tray);
  const moss = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.02, 1.3), new THREE.MeshStandardMaterial({ color: 0x5f7f3a, roughness: 1 }));
  moss.position.y = 0.31;
  root.add(moss);

  const up = new THREE.Vector3(0, 1, 0);
  function branch(start, dir, len, radius, depth) {
    const end = start.clone().addScaledVector(dir, len);
    const geo = new THREE.CylinderGeometry(radius * 0.7, radius, len, 8);
    const m = new THREE.Mesh(geo, bark);
    m.position.copy(start).lerp(end, 0.5);
    m.quaternion.setFromUnitVectors(up, dir.clone().normalize());
    root.add(m);

    if (depth === 0) {
      // foliage pad: flattened cluster of low-poly spheres
      for (let i = 0; i < 5; i++) {
        const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22 + rng() * 0.12, 0), leaf);
        s.position.copy(end).add(new THREE.Vector3((rng() - 0.5) * 0.5, rng() * 0.12, (rng() - 0.5) * 0.5));
        s.scale.y = 0.55;
        root.add(s);
      }
      return;
    }
    const kids = depth > 2 ? 2 : 3;
    for (let k = 0; k < kids; k++) {
      const d = dir.clone()
        .applyAxisAngle(new THREE.Vector3(1, 0, 0), (rng() - 0.5) * 1.2)
        .applyAxisAngle(new THREE.Vector3(0, 0, 1), (rng() - 0.5) * 1.4)
        .normalize();
      d.y = Math.max(d.y, 0.15);
      branch(end, d.normalize(), len * (0.62 + rng() * 0.15), radius * 0.68, depth - 1);
    }
  }
  branch(new THREE.Vector3(0.2, 0.3, 0), new THREE.Vector3(-0.3, 1, 0.1).normalize(), 0.9, 0.16, 4);

  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
