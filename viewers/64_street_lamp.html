<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Victorian Street Lamp</title>
<style>html,body{margin:0;height:100%;background:#efece6;font-family:system-ui,sans-serif}
#cap{position:fixed;left:16px;bottom:16px;max-width:520px;color:#333;font-size:14px}</style></head>
<body><div id="cap"><b>64 · Victorian Street Lamp</b><br>A Victorian cast-iron street lamp with a lantern head and a fluted post.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Prompt 64: "A Victorian cast-iron street lamp with a lantern head and a fluted post."
const meta = { id: '64', name: 'Victorian Street Lamp', prompt: 'A Victorian cast-iron street lamp with a lantern head and a fluted post.', detail: 'medium' };

function build(THREE) {
  const root = new THREE.Group();
  const iron = new THREE.MeshStandardMaterial({ color: 0x1f2a24, metalness: 0.7, roughness: 0.45 });
  const glow = new THREE.MeshStandardMaterial({ color: 0xfff1c4, emissive: 0xffc861, emissiveIntensity: 1.6, transparent: true, opacity: 0.85 });
  // Base + fluted post (radius modulated by cos(12a))
  const bp = [[0.001, 0], [0.4, 0], [0.4, 0.1], [0.3, 0.2], [0.3, 0.45], [0.18, 0.6], [0.13, 0.7], [0.001, 0.7]].map(([x, y]) => new THREE.Vector2(x, y));
  root.add(new THREE.Mesh(new THREE.LatheGeometry(bp, 32), iron));
  const pg = new THREE.CylinderGeometry(0.08, 0.11, 3.0, 48, 20);
  const p = pg.attributes.position;
  for (let i = 0; i < p.count; i++) { const a = Math.atan2(p.getZ(i), p.getX(i)), k = 1 + 0.08 * Math.cos(a * 12); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); }
  pg.computeVertexNormals();
  const post = new THREE.Mesh(pg, iron);
  post.position.y = 2.2;
  root.add(post);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 8, 24), iron);
  collar.rotation.x = Math.PI / 2; collar.position.y = 3.7;
  root.add(collar);
  // Ladder bar
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.7, 8), iron);
  bar.rotation.z = Math.PI / 2; bar.position.y = 3.5;
  root.add(bar);
  // Lantern head: tapered 4-sided glass box with iron frame, roof and finial
  const Y = 3.75;
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.22, 0.6, 4), glow);
  lamp.rotation.y = Math.PI / 4;
  lamp.position.y = Y + 0.3;
  root.add(lamp);
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + (k * Math.PI) / 2;
    const e = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.62, 6), iron);
    e.position.set(Math.cos(a) * 0.29, Y + 0.3, Math.sin(a) * 0.29);
    e.rotation.set(Math.sin(a) * 0.2, 0, -Math.cos(a) * 0.2);
    root.add(e);
  }
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.35, 4), iron);
  roof.rotation.y = Math.PI / 4;
  roof.position.y = Y + 0.78;
  root.add(roof);
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), iron);
  fin.position.y = Y + 1.0;
  root.add(fin);
  const light = new THREE.PointLight(0xffd08a, 3, 6);
  light.position.y = Y + 0.3;
  root.add(light);
  return root;
}

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefece6);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const obj = build(THREE); scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.copy(c).add(new THREE.Vector3(1, 0.55, 1.25).normalize().multiplyScalar(rad * 3.4));
const ctl = new OrbitControls(cam, r.domElement); ctl.target.copy(c); ctl.autoRotate = true; ctl.update();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(scene, cam); });
</script></body></html>
